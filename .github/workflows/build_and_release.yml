name: Build & Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v2.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: Windows
            runner: windows-latest

          - os: Linux
            runner: ubuntu-22.04

          - os: macOS
            runner: macos-15-intel # Intel runner; artifacts are genuinely x64.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download runtime dependencies
        run: |
          python scripts/download_dependencies.py

      - name: Build GoExport
        run: |
          pyinstaller GoExport.spec

      - name: Packaged PyScap smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dist/GoExport.exe --help
          python -c "import scap; print('PyScap import OK')"

      - name: Packaged PyScap smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/GoExport --help
          python -c "import scap; print('PyScap import OK')"

      - name: Prepare distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distributionDirectory = 'dist/GoExport'
          $guiArchive = Join-Path $env:RUNNER_TEMP 'GoExport-GUI-windows-x64.zip'
          $guiDirectory = Join-Path $env:RUNNER_TEMP 'GoExport-GUI'

          New-Item -ItemType Directory -Path $distributionDirectory | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/GoExport/GoExport-GUI/releases/latest/download/GoExport-GUI-windows-x64.zip' -OutFile $guiArchive
          Expand-Archive -LiteralPath $guiArchive -DestinationPath $guiDirectory

          Copy-Item dist/GoExport.exe $distributionDirectory/
          Copy-Item -Recurse bin $distributionDirectory/
          Copy-Item -Recurse resources $distributionDirectory/
          Copy-Item README.md $distributionDirectory/
          Copy-Item LICENSE $distributionDirectory/
          Copy-Item (Join-Path $guiDirectory 'GoExport-GUI.exe') $distributionDirectory/
          Copy-Item (Join-Path $guiDirectory 'presets.toml') $distributionDirectory/

      - name: Prepare distribution (Linux)
        if: runner.os == 'Linux'
        run: |
          distribution_directory=dist/GoExport
          gui_archive="$RUNNER_TEMP/GoExport-GUI-linux-x64.zip"
          gui_directory="$RUNNER_TEMP/GoExport-GUI"
          mv dist/GoExport dist/GoExport-cli
          mkdir "$distribution_directory"
          mv dist/GoExport-cli "$distribution_directory/GoExport"
          curl --fail --location --output "$gui_archive" https://github.com/GoExport/GoExport-GUI/releases/latest/download/GoExport-GUI-linux-x64.zip
          unzip -q "$gui_archive" -d "$gui_directory"
          cp "$gui_directory/GoExport-GUI" "$distribution_directory/"
          cp "$gui_directory/presets.toml" "$distribution_directory/"
          cp -r bin "$distribution_directory/"
          cp -r resources "$distribution_directory/"
          cp README.md "$distribution_directory/"
          cp LICENSE "$distribution_directory/"

      - name: Prepare distribution (macOS)
        if: runner.os == 'macOS'
        run: |
          distribution_directory=dist/GoExport
          gui_archive="$RUNNER_TEMP/GoExport-GUI-macos-intel.zip"
          gui_directory="$RUNNER_TEMP/GoExport-GUI"
          mv dist/GoExport dist/GoExport-cli
          mkdir "$distribution_directory"
          mv dist/GoExport-cli "$distribution_directory/GoExport"
          curl --fail --location --output "$gui_archive" https://github.com/GoExport/GoExport-GUI/releases/latest/download/GoExport-GUI-macos-intel.zip
          unzip -q "$gui_archive" -d "$gui_directory"
          cp "$gui_directory/GoExport-GUI" "$distribution_directory/"
          cp "$gui_directory/presets.toml" "$distribution_directory/"
          cp -r bin "$distribution_directory/"
          cp -r resources "$distribution_directory/"
          cp README.md "$distribution_directory/"
          cp LICENSE "$distribution_directory/"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/GoExport `
            -DestinationPath GoExport-windows-x64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar \
            -czf GoExport-linux-x64.tar.gz \
            -C dist \
            GoExport

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          tar \
            -czf GoExport-macos-x64.tar.gz \
            -C dist \
            GoExport

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GoExport-windows-x64
          path: GoExport-windows-x64.zip

      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: GoExport-linux-x64
          path: GoExport-linux-x64.tar.gz

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GoExport-macos-x64
          path: GoExport-macos-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: build

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#b}"
          section=$(awk '/^## \['"$version"'\]/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)

          if [[ -z "$section" ]]; then
            echo "No changelog section found for $version" >&2
            exit 1
          fi

          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$section" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GoExport-windows-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: GoExport-linux-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GoExport-macos-x64

      - name: Move release archives
        run: |
          mv GoExport-windows-x64/GoExport-windows-x64.zip .
          mv GoExport-linux-x64/GoExport-linux-x64.tar.gz .
          mv GoExport-macos-x64/GoExport-macos-x64.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.text }}

          files: |
            GoExport-windows-x64.zip
            GoExport-linux-x64.tar.gz
            GoExport-macos-x64.tar.gz

      - name: Notify Discord
        if: ${{ !startsWith(github.ref_name, 'b') }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          payload=$(jq -n \
            --arg repo "$repo_name" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg channel "<#1347670260844855376>" \
            --arg changelog "$CHANGELOG" \
            '{content: "\($repo) - \($tag)\n\n\($changelog)\n\n\($channel)"}')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
