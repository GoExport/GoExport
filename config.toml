# GoExport user configuration. Omitted values use the built-in defaults.

[video]
# format = "mp4"
# wide = true
# width = 1280
# height = 720
# fps = 24

[wrapper]
# url = "http://localhost:4343/"
# api_url = "http://localhost:4343/"
# swf_url = "http://localhost:4664/animation/414827163ad4eb60/player.swf"
# store_path = "http://localhost:4664/store/3a981f5cb2739137/<store>"
# client_theme_path = "http://localhost:4664/static/ad44370a650793d9/<client_theme>"

[browser]
# chrome = "bin/ungoogled-chromium/chrome.exe"
# chromedriver = "bin/ungoogled-chromium/chromedriver.exe"
# ffmpeg = "bin/ffmpeg/bin/ffmpeg.exe"
# electron = false

[flash]
# plugin_path = "bin/ungoogled-chromium/extensions/pepflashplayer.dll"
# plugin_version = "32.0.0.371"

[recording]
# backend = "capturekit"   # or "obs"

[capturekit]
# Audio to record: "process" (only GoExport's Chromium), "system" (everything
# on the default output device), or "none".
# audio = "process"
# H.264 encoder: "auto" validates NVENC, QSV and AMF before using libx264.
# encoder = "auto"

[verification]
# Complete Cloudflare and Anubis verification in GoExport's own browser session.
# Anubis proof-of-work checks finish by themselves; the browser is only shown
# (on Linux through the bundled VNC viewer) when the user must help.
# interactive = true
# Seconds to wait for verification; 0 waits indefinitely.
# timeout = 300
# Seconds an automatic Anubis check may run before asking for manual help;
# 0 keeps waiting until the timeout above.
# automatic_timeout = 60

[obs]
# host = "127.0.0.1"
# port = 4455
# profile = "GoExport"
# scene_collection = "GoExport"
# Set the password through GOEXPORT_OBS_PASSWORD, not this file.
